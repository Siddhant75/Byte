<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byte - Floating Companion</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="widget-container">
        <!-- Draggable Avatar Zone -->
        <div class="avatar-zone">
            <svg id="companion-svg" class="pixel-bunny" viewBox="0 0 100 100" width="100%" height="100%">
                <g id="bunny-body">
                    <!-- Cat Ears -->
                    <path d="M 22 45 L 28 15 L 42 35 Z" fill="#fff" stroke="#fff" stroke-linejoin="round" />
                    <path d="M 78 45 L 72 15 L 58 35 Z" fill="#fff" stroke="#fff" stroke-linejoin="round" />
                    <!-- Main Blob Body -->
                    <path d="M 15 85 C 15 35, 85 35, 85 85 Z" fill="#fff" />
                    <!-- Mouth (Cute 'w') -->
                    <path d="M 46 55 Q 48 58 50 55 Q 52 58 54 55" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" />
                    <!-- Blushes -->
                    <rect x="30" y="55" width="8" height="4" rx="2" fill="#FFD1DC" opacity="0.5" />
                    <rect x="62" y="55" width="8" height="4" rx="2" fill="#FFD1DC" opacity="0.5" />
                </g>
                <g id="bunny-eyes">
                    <circle cx="38" cy="48" r="3" fill="#333" />
                    <circle cx="62" cy="48" r="3" fill="#333" />
                </g>
                <!-- Keyboard -->
                <g id="prop-keyboard" style="opacity: 0;">
                    <rect x="10" y="70" width="80" height="20" rx="4" fill="#ddd" stroke="#bbb" stroke-width="2" />
                    <!-- Keys -->
                    <rect x="15" y="74" width="10" height="12" rx="2" fill="#fff" />
                    <rect x="29" y="74" width="10" height="12" rx="2" fill="#fff" />
                    <rect x="43" y="74" width="28" height="12" rx="2" fill="#fff" /> <!-- spacebar -->
                    <rect x="75" y="74" width="10" height="12" rx="2" fill="#fff" />
                </g>
                <!-- Left Arm -->
                <g id="arm-left">
                    <path d="M 22 65 C 15 65, 15 85, 30 85 C 38 85, 38 65, 22 65 Z" fill="#fff" stroke="#ddd" stroke-width="1" />
                </g>
                <!-- Right Arm -->
                <g id="arm-right">
                    <path d="M 78 65 C 85 65, 85 85, 70 85 C 62 85, 62 65, 78 65 Z" fill="#fff" stroke="#ddd" stroke-width="1" />
                </g>
                <g id="prop-sweat" style="opacity: 0;">
                    <!-- Teardrop shape -->
                    <path d="M 65 35 Q 70 45 65 50 Q 60 45 65 35 Z" fill="#4db8ff" opacity="0.8" />
                </g>
            </svg>
            <div id="avatar-prompt" class="avatar-prompt">Press Ctrl+Space to toggle chat</div>
            <div id="mini-timer" class="mini-timer">25:00</div>
        </div>

        <!-- Collapsible Chat Zone -->
        <div class="chat-container" id="chat-container">
            <!-- Integrated Timer Zone -->
            <div class="timer-zone">
                <div class="timer-config">
                    <input type="number" id="timer-minutes" value="25" min="1" max="120">
                    <span class="min-label">min</span>
                </div>
                <h2 id="time-display">25:00</h2>
                <div class="timer-controls">
                    <button id="start-timer-btn">Start Focus</button>
                    <button id="stop-timer-btn">Stop</button>
                </div>
            </div>
            <div class="chat-log" id="chat-log">
                <div class="message bot">
                    Byte is active. Press Ctrl+Space to toggle chat.
                </div>
            </div>
            <div class="input-area">
                <button id="history-toggle-btn" title="View History">📜</button>
                <input type="text" id="chat-input" placeholder="Say something..." spellcheck="false" autocomplete="off">
                <button id="send-btn">></button>
            </div>
        </div>

        <!-- History Overlay -->
        <div id="history-overlay" class="overlay">
            <div class="overlay-header">
                <h3>Interaction History</h3>
                <button id="close-history-btn">×</button>
            </div>
            <div id="history-list">
                <!-- History items will be injected here -->
            </div>
            <div class="overlay-footer">
                <button id="clear-history-btn">Clear All</button>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>

</html>
